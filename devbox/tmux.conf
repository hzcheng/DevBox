unbind C-b
# remap prefix to Control + a
set -g prefix C-a
# bind 'C-a C-a' to type 'C-a'
bind C-a send-prefix


# 0 is too far from ` ;)
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on
set -g allow-rename off

set -g default-terminal "tmux-256color"
set -g terminal-overrides ',xterm-256color:RGB'
set -g status-keys vi
set -g history-limit 50000

setw -g mode-keys vi
setw -g monitor-activity on
set -g mouse on

set -g focus-events on
setw -g xterm-keys on
set -g window-size latest
set -g visual-activity off
set -g visual-bell off
set -g bell-action none
set -sg escape-time 10

# ============================================
# Clipboard integration via OSC 52
# Works in code-server browser terminal and most modern terminals.
# ============================================
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# ============================================
# Display & message styling
# ============================================
set -g display-time 3000
set -g display-panes-time 2000
set -g message-style bg=colour33,fg=white,bold
set -g message-command-style bg=colour33,fg=white,bold

bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

bind-key -n C-S-Left  swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind K confirm-before -p "kill all other panes? (y/n)" "kill-pane -a"

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+Shift+1~6: jump directly to pane 1~6
bind -n M-! select-pane -t 1
bind -n M-@ select-pane -t 2
bind -n M-# select-pane -t 3
bind -n M-$ select-pane -t 4
bind -n M-% select-pane -t 5
bind -n M-^ select-pane -t 6

# Use Alt-arrow keys without prefix key to resize panes
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

# Shift arrow to switch windows
bind -n C-Left  previous-window
bind -n C-Right next-window

bind -n M-N previous-window
bind -n M-n next-window

# Alt+, to rename current window
bind -n M-, command-prompt -I "#W" -p "rename-window:" "rename-window '%%'"

# Alt+1..9 to jump to window(tab) 1..9
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Map Alt-z to zoom in and out pane
bind -n M-z resize-pane -Z

# Alt+W to show window list (same as Ctrl+a W)
bind -n M-w choose-tree -w

# Configure copy and paste shortcuts
# for tmux 2.4 or newer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# 鼠标双击选择单词并复制
bind -T root DoubleClick1Pane select-pane \; copy-mode \; send-keys -X select-word \; send-keys -X copy-selection-and-cancel
# 鼠标三击选择整行并复制
bind -T root TripleClick1Pane select-pane \; copy-mode \; send-keys -X select-line \; send-keys -X copy-selection-and-cancel

# pane movement
bind-key b command-prompt -p "join pane from:"  "join-pane -s ':%%'"
bind-key a command-prompt -p "send pane to:"  "join-pane -t ':%%'"

# Rename current pane (shows in border)
bind -n M-T command-prompt -p "pane title:" "select-pane -T '%%'"

# Reload config
bind -n M-r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# ============================================
# Search & navigation
# ============================================
# Vim-style search from normal mode
bind / copy-mode \; send-keys /

# ============================================
# Pane management shortcuts
# ============================================
# Swap current pane with next/previous
bind > swap-pane -D
bind < swap-pane -U
# Break current pane into a new window
bind ! break-pane
# Cycle through layouts
bind Space next-layout
# Clear screen (preserves tmux scrollback history)
bind C-l send-keys 'clear' Enter

# ============================================
# Popup terminal (tmux 3.2+)
# ============================================
# Open a floating terminal in current directory
# Uses nested tmux (-L popup) so mouse scroll and copy-mode work inside popup.
# Inner tmux uses default prefix C-b (outer uses C-a, no conflict).
# Popup toggle: outer Alt+t opens, inner Alt+t closes (detach-client)
# Each window gets its own popup (session-name + window-index)
bind C-t run-shell 'S=#{session_name}-#{window_index}; tmux display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux -L popup-$S new-session -A -s popup-$S \; bind -n M-t detach-client"'
bind -n M-t run-shell 'S=#{session_name}-#{window_index}; tmux display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux -L popup-$S new-session -A -s popup-$S \; bind -n M-t detach-client"'
# Quick session switcher (avoid C-s: tmux-resurrect uses it for save)
bind S choose-session

# ============================================
# STATUS BAR (Powerline-inspired style)
# ============================================
set -g status-position bottom
set -g status-justify left
set -g status-style bg=colour235,fg=colour250
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 100

# 左侧：prefix 时变红提示，平时绿色 session 名
set -g status-left '#{?client_prefix,#[fg=colour235]#[bg=colour196]#[bold] PREFIX ,#[fg=colour235]#[bg=colour82]#[bold] #S }#[default] '

# 窗口分隔符
set -g window-status-separator ''

# 非活动窗口：灰色竖线分隔
set -g window-status-format '#[fg=colour240]│#[fg=colour250] #I:#W '

# 活动窗口：蓝色三角箭头包裹的高亮胶囊
set -g window-status-current-format '#[fg=colour235,bg=colour33]▶#[fg=colour255,bg=colour33,bold] #I:#W#{?window_zoomed_flag,*,} #[fg=colour33,bg=colour235]▶#[fg=colour235]'

# 有 activity 的窗口：黄色提示
set -g window-status-activity-style fg=colour220,bg=colour235

# 右侧：Git 分支(dirty提示) + zoom 指示 + 负载 + 时间
set -g status-right '#[fg=colour240]#{?window_zoomed_flag,[ZOOM] ,}#[fg=colour37]#(cd #{pane_current_path} 2>/dev/null && b=$(git symbolic-ref --short HEAD 2>/dev/null || git describe --tags --exact-match 2>/dev/null || git rev-parse --short HEAD 2>/dev/null) && [ -n "$b" ] && d=$(git diff --quiet 2>/dev/null || echo "*") && echo "$b$d" || echo "-") #[fg=colour240]| #[fg=colour220]#(cut -d" " -f1-3 /proc/loadavg) #[fg=colour240]| #[fg=colour250]%H:%M#[default]'

# Pane 边框 + 顶部信息条：左侧编号，右侧 pane 名字
set -g pane-border-status top
set -g pane-border-format '#[align=left]#[fg=colour240]#{pane_index} #[align=right]#[fg=colour196]#{?pane_title,#{pane_title},#{pane_current_command}}'
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour33
set -g pane-border-lines single

bind-key y set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# ============================================
# Tmux Session Persistence
# tmux-resurrect + tmux-continuum: save and
# restore sessions across container restarts.
# ============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically restore last saved environment when tmux server starts
set -g @continuum-restore 'on'
# Auto-save interval in minutes (default: 15, we use 5 for more frequent saves)
set -g @continuum-save-interval '5'

# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
if-shell "test -f ~/.tmux/plugins/tpm/tpm" \
    "run '~/.tmux/plugins/tpm/tpm'"
