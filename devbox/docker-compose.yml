services:
  devbox:
    platform: ${ARCH:+linux/${ARCH}}
    build:
      context: ..
      dockerfile: devbox/Dockerfile
      target: ${DOCKER_BUILD_TARGET:-devbox}
      network: host
      args:
        USE_CN_MIRROR: ${USE_CN_MIRROR:-false}
        TARGETARCH_OVERRIDE: ${ARCH:-}
        http_proxy: ${BUILD_PROXY}
        https_proxy: ${BUILD_PROXY}
        all_proxy: ${BUILD_PROXY}
        HTTP_PROXY: ${BUILD_PROXY}
        HTTPS_PROXY: ${BUILD_PROXY}
        ALL_PROXY: ${BUILD_PROXY}
        DEV_USER: ${DEV_USER:-root}
        DEV_HOME: ${DEV_HOME:-/root}
        DEV_UID: ${DEV_UID:-0}
        DEV_GID: ${DEV_GID:-0}
        DEV_GRANT_SUDO: ${DEV_GRANT_SUDO:-false}
    image: home.teraai.cn/hzcheng/devbox:${ARCH:-local}-${DOCKER_BUILD_TARGET:-devbox}
    container_name: ${PROJECT_NAME}-devbox
    restart: unless-stopped
    ulimits:
      core:
        soft: -1
        hard: -1
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # for docker-in-docker
      - ${HOST_SSH_DIR:-~/.ssh}:${DEV_HOME:-/root}/.ssh:ro # mount ssh
      - /data/work/mnt:/mnt
      - ${DEV_ROOT:-dev-root}:${DEV_HOME:-/root}
      - ${DEV_PROJECTS:-dev-projects}:${DEV_HOME:-/root}/projects
      - ..:${DEV_HOME:-/root}/projects/DevBox:cached
      - ${CODEWIZ_CONFIG_DIR:-/home/deploy/.local/share/codewiz}:${DEV_HOME:-/root}/.local/share/codewiz
    environment:
      - TZ=Asia/Shanghai
      - LANG=zh_CN.UTF-8
      - LANGUAGE=zh_CN:zh
      - LC_ALL=zh_CN.UTF-8
      - DOCKER_BUILDKIT=1
      - all_proxy=${RUNTIME_PROXY}
      - ASAN_OPTIONS=abort_on_error=1:disable_coredump=0:unmap_shadow_on_exit=1
      - http_proxy=${RUNTIME_PROXY}
      - HTTP_PROXY=${RUNTIME_PROXY}
      - https_proxy=${RUNTIME_PROXY}
      - HTTPS_PROXY=${RUNTIME_PROXY}
      - no_proxy=${NO_PROXY}
      - NO_PROXY=${NO_PROXY}
      - SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY}
      # DeepSeek
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com/anthropic}
      # Kimi Code 2.5
      - KIMI_CODE_API_KEY=${KIMI_CODE_API_KEY}
      - KIMI_CODE_API_URL=${KIMI_CODE_API_URL:-https://api.moonshot.cn/v1}
      # Codewiz Proxy
      - CODEWIZ_SESSION_TOKEN=${CODEWIZ_SESSION_TOKEN}
      - CODEWIZ_USER_EMAIL=${CODEWIZ_USER_EMAIL}
      # Claude Code telemetry
      - CLAUDE_CODE_ENABLE_TELEMETRY=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://49.234.245.115:8089
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-user.name=%E5%AD%90%E7%89%99}
      # Git identity
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
      # Dev user
      - DEV_USER=${DEV_USER:-root}
      - DEV_HOME=${DEV_HOME:-/root}
      - DEV_GRANT_SUDO=${DEV_GRANT_SUDO:-false}
    command: /usr/local/bin/start-services.sh
    security_opt:
      - seccomp:unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SSH_PORT:-2222}:22"

volumes:
  dev-root:
    name: ${PROJECT_NAME}-dev-root
  dev-projects:
    name: ${PROJECT_NAME}-project-data
