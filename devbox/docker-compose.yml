services:
  devbox:
    build:
      context: .
      dockerfile: Dockerfile.${ARCH}
      network: host
      args:
        CODE_SERVER_VERSION: ${CODE_SERVER_VERSION:-4.106.3}
        CODE_SERVER_RELEASE_BASE_URL: ${CODE_SERVER_RELEASE_BASE_URL:-https://github.com/coder/code-server/releases/download}
        http_proxy: ${PROXY}
        https_proxy: ${PROXY}
        all_proxy: ${PROXY}
        HTTP_PROXY: ${PROXY}
        HTTPS_PROXY: ${PROXY}
        ALL_PROXY: ${PROXY}
    image: home.teraai.cn/hzcheng/devbox:${ARCH}
    container_name: ${PROJECT_NAME}-devbox
    restart: unless-stopped
    ulimits:
      core:
        soft: -1
        hard: -1
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # for docker-in-docker
      - ${DEV_ROOT:-dev-root}:/root
      - ${DEV_PROJECTS:-dev-projects}:/Projects
      - ..:/Projects/DevBox:cached
      - ./config/code-server/User/keybindings.json:/root/.local/share/code-server/User/keybindings.json:cached
      - ./config/code-server/User/settings.json:/root/.local/share/code-server/User/settings.json:cached
      - ./config/code-server/User/projects.json:/root/.local/share/code-server/User/globalStorage/alefragnani.project-manager/projects.json:cached
    environment:
      - TZ=Asia/Shanghai
      - LANG=zh_CN.UTF-8
      - LANGUAGE=zh_CN:zh
      - LC_ALL=zh_CN.UTF-8
      - DOCKER_BUILDKIT=1
      - all_proxy=${PROXY}
      - ASAN_OPTIONS=abort_on_error=1:disable_coredump=0:unmap_shadow_on_exit=1
      - http_proxy=${PROXY}
      - https_proxy=${PROXY}
      # DeepSeek
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com}
      # Kimi Code 2.5
      - KIMI_CODE_API_KEY=${KIMI_CODE_API_KEY}
      - KIMI_CODE_API_URL=${KIMI_CODE_API_URL:-https://api.moonshot.cn/v1}
      # Claude Code
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      # ChatGPT Codex
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Git identity
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
    command: /usr/local/bin/start-services.sh
    security_opt:
      - seccomp:unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
      - "${SSH_PORT:-2222}:22"

volumes:
  dev-root:
    name: ${PROJECT_NAME}-dev-root
  dev-projects:
    name: ${PROJECT_NAME}-project-data
